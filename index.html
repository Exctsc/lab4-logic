<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4 - Study Session</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <h1>Study Session</h1>
  <p>Studying uses energy. Breaks give it back. What you did before decides how you feel now.</p>

  <div id="nameArea">
    <input type="text" id="nameInput" placeholder="Type your name">
    <button id="nameBtn">Start</button>
  </div>

  <div id="box">
    <p id="face">🙂</p>
    <h2 id="mood">Doing Okay</h2>
    <p id="message">Message goes here</p>
    <p>Energy: <span id="energy">50</span> / 100</p>
    <p>Times studied: <span id="studyCount">0</span></p>
    <p id="coffeeText">Coffee: not had yet</p>
  </div>

  <button id="studyBtn">Study</button>
  <button id="breakBtn">Take a Break</button>
  <button id="coffeeBtn">Drink Coffee</button>
  <button id="resetBtn">Reset</button>

  <footer>
    <p>CCT360 Lab 4 by Tony Ren.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
